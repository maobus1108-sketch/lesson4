<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아기곰의 양사 강 건너기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;800&family=Noto+Sans+SC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8F4F8;--fg:#14323F;--mut:#5B7480;--card:#FFFFFF;--line:#BFD6DE;--ac:#0B7FB0;--ok:#157A4B;--bad:#B3341F;--gold:#9A6410;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1D24;--fg:#E4F0F4;--mut:#93AAB3;--card:#162A33;--line:#2A4550;--ac:#5CC4EE;--ok:#4FD08F;--bad:#F08A72;--gold:#E8B24F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1D24;--fg:#E4F0F4;--mut:#93AAB3;--card:#162A33;--line:#2A4550;--ac:#5CC4EE;--ok:#4FD08F;--bad:#F08A72;--gold:#E8B24F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 'Noto Sans KR',system-ui,sans-serif;-webkit-user-select:none;user-select:none;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
[hidden]{display:none!important}
main{max-width:760px;height:100%;margin:0 auto;padding:8px 10px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
.jua{font-family:'Jua','Noto Sans KR',sans-serif}
ruby{display:inline-flex;flex-direction:column-reverse;text-align:center;line-height:1.15;vertical-align:middle;font-family:'Noto Sans SC','Noto Sans KR',sans-serif;font-weight:900}
rt{display:block;font-size:.55em;font-weight:700;color:var(--gold);white-space:nowrap}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:18px;margin:0;color:var(--ac)}
.stat{display:flex;gap:8px}
.stat div{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:2px 12px;text-align:center;font-size:12px;color:var(--mut);line-height:1.3}
.stat b{display:block;font-size:17px;color:var(--fg)}
.sign{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;align-items:center;gap:14px}
.sign .sq{font-size:30px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sign rt{font-size:15px}
.sign .hint{font-size:14px}
.sign small{display:block;color:var(--mut);font-size:13px}
#stage{position:relative;display:grid;grid-template-columns:22% 1fr 22%;flex:1;min-height:0;--s:1;border-radius:18px;overflow:hidden;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.bank{background:#7CC36A;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:12px 0;font-size:30px}
.bank.l{border-right:8px solid #5FA34E}
.bank.r{border-left:8px solid #5FA34E}
.river{position:relative;display:flex;flex-direction:column;justify-content:space-around;align-items:flex-start;padding:8px 0 8px 5%;background:linear-gradient(90deg,#5BB8E8,#38A3DC,#5BB8E8);overflow:visible}
.river::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.2) 0 16px,transparent 16px 46px);animation:flow 1.6s linear infinite;pointer-events:none}
@keyframes flow{to{background-position:0 46px}}
.boat{position:relative;width:calc(176px*var(--s));height:calc(128px*var(--s));flex:none;cursor:pointer;z-index:2;outline-offset:4px}
.sc{width:176px;height:128px;transform:scale(var(--s));transform-origin:0 0}
.boat:focus-visible{outline:3px solid #fff}
.boat.gone{visibility:hidden;pointer-events:none}
.bob{position:relative;height:128px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(1.2deg)}}
.hull{position:absolute;left:0;bottom:0;width:176px;height:46px;filter:drop-shadow(0 6px 6px rgba(8,60,100,.35))}
.cargo{position:absolute;right:6px;bottom:40px;width:108px;background:#FFF8E6;border:2px solid #7A4A1A;border-radius:10px;text-align:center;padding:3px 3px 4px;color:#3B2410}
.cargo .em{font-size:24px;line-height:1.1}
.cargo ruby{font-size:19px;max-width:100%}
.cargo rt{font-size:11px;color:#8A5300;white-space:normal}
.cargo .ko{font-size:12px;font-weight:700}
.deck{position:absolute;left:8px;bottom:38px;width:56px;height:60px}
#bear{position:absolute;left:calc(11% - 30px*var(--s));top:calc(50% - 31px*var(--s));width:calc(60px*var(--s));height:calc(62px*var(--s));z-index:6}
.deck #bear{width:60px;height:62px}
#bear svg{width:100%;height:100%;display:block}
#say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#FFF8E6;border:2px solid #7A4A1A;border-radius:12px;padding:0 8px;font-size:22px;color:#3B2410;white-space:nowrap;margin-bottom:4px}
#say rt{font-size:11px;color:#8A5300}
#fb{position:absolute;left:8px;right:8px;bottom:8px;z-index:10;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#fb .ok{color:var(--ok);font-weight:800;font-size:18px}
#fb .no{color:var(--bad);font-weight:800;font-size:18px}
#fb .fm{font-size:20px;margin:2px 0}
#fb .pyl{color:var(--gold);font-weight:700;font-size:16px}
#fb small{display:block;color:var(--mut)}
button.go{margin-top:10px;border:0;border-radius:12px;padding:10px 24px;font:inherit;font-weight:800;color:#fff;cursor:pointer}
button.go.ok{background:#157A4B}button.go.bad{background:#B3341F}button.go.blue{background:#0B7FB0}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#modal{position:fixed;inset:0;background:rgba(10,25,32,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mbox{background:var(--card);border-radius:22px;max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:22px;text-align:center;border:4px solid #E8B24F}
.mbox dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;margin:14px 0}
.mbox dt{color:var(--mut)}.mbox dd{margin:0;font-weight:800;text-align:right}
.list{text-align:left;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.list div{padding:3px 0}
.list .p{color:var(--gold);font-weight:700}
@media (prefers-reduced-motion:reduce){.bob,.river::before{animation:none}}
</style>
</head>
<body>
<main>
<header>
 <h1 class="jua">🐻 아기곰의 양사 강 건너기</h1>
 <div class="stat"><div>진행도<b id="prog">1 / 8</b></div><div>점수<b id="score">0점</b></div></div>
</header>
<div class="sign" id="sign"></div>
<div id="stage">
 <div class="bank l"><span>🌳</span><span>🌷</span></div>
 <div class="river" id="river"></div>
 <div class="bank r" id="bankR"><span>🏁</span><span>🏡</span><span>🌳</span></div>
 <div id="bear">
  <div id="say"></div>
  <svg viewBox="0 0 60 62" aria-label="아기곰"><ellipse cx="30" cy="49" rx="15" ry="13" fill="#8B5A2B"/><circle cx="14" cy="11" r="8" fill="#8B5A2B"/><circle cx="14" cy="11" r="4" fill="#F4A460"/><circle cx="46" cy="11" r="8" fill="#8B5A2B"/><circle cx="46" cy="11" r="4" fill="#F4A460"/><circle cx="30" cy="26" r="19" fill="#A0522D"/><ellipse cx="30" cy="32" rx="10" ry="7" fill="#F4A460"/><ellipse cx="30" cy="29" rx="3.5" ry="2.5" fill="#3E2723"/><path d="M26 34Q30 38 34 34" stroke="#3E2723" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="22" cy="22" r="2.6" fill="#212121"/><circle cx="38" cy="22" r="2.6" fill="#212121"/><circle cx="16" cy="29" r="3" fill="#FF8080" opacity=".5"/><circle cx="44" cy="29" r="3" fill="#FF8080" opacity=".5"/></svg>
 </div>
 <div id="fb" hidden><div id="ft"></div></div>
</div>
</main>
<div id="modal" hidden><div class="mbox">
 <div style="font-size:48px">🎉🐻⛵</div>
 <h2 class="jua" style="margin:4px 0">모든 강을 무사히 건넜어요!</h2>
 <dl><dt>🎯 최종 점수</dt><dd id="fs"></dd><dt>⏱️ 걸린 시간</dt><dd id="ftm"></dd><dt>🏅 정답률</dt><dd id="fa"></dd></dl>
 <div class="list" id="list"></div>
 <button class="go blue" id="again" style="width:100%">🔄 처음부터 다시 도전하기</button>
</div></div>
<script>
// 문제 데이터: q=양사, qp=양사 병음, h/p/k/i=명사 한자·병음·뜻·그림
const D=[
{q:'条',qp:'tiáo',hint:'가늘고 길거나 굽어 있는 사물',h:'裙子',p:'qúnzi',k:'치마',i:'👗',e:'치마, 바지, 물고기, 길처럼 길쭉한 것에는 条(tiáo)를 써요.'},
{q:'个',qp:'gè',hint:'사람이나 일반적인 사물 개체',h:'人',p:'rén',k:'사람',i:'🧑',e:'사람이나 전용 양사가 없을 때는 가장 흔히 个(gè)를 써요.'},
{q:'台',qp:'tái',hint:'기계, 전자제품, 컴퓨터 장비',h:'平板电脑',p:'píngbǎn diànnǎo',k:'태블릿 PC',i:'💻',e:'컴퓨터, 태블릿, TV 같은 기계 장비는 台(tái)로 세요.'},
{q:'支',qp:'zhī',hint:'원통형의 가늘고 곧은 펜·막대',h:'笔',p:'bǐ',k:'펜, 연필',i:'✏️',e:'펜처럼 가늘고 곧은 막대형 사물에는 支(zhī)를 써요.'},
{q:'件',qp:'jiàn',hint:'상의, 옷, 외투 및 일(사건)',h:'衣服',p:'yīfu',k:'옷',i:'👕',e:'옷이나 일(事情)은 件(jiàn)으로 세요.'},
{q:'瓶',qp:'píng',hint:'병에 담긴 액체나 음료',h:'牛奶',p:'niúnǎi',k:'우유',i:'🥛',e:'병에 든 우유, 맥주, 생수는 瓶(píng)으로 세요.'},
{q:'斤',qp:'jīn',hint:'과일·고기 등의 무게 단위(500g)',h:'苹果',p:'píngguǒ',k:'사과',i:'🍎',e:'시장에서 무게를 달아 사는 과일·채소는 斤(jīn)으로 세요.'},
{q:'双',qp:'shuāng',hint:'좌우 두 개가 한 짝을 이루는 사물',h:'鞋',p:'xié',k:'신발',i:'👟',e:'신발, 젓가락, 양말, 장갑처럼 두 개가 한 쌍인 것은 双(shuāng)으로 세요.'}];

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const sh=a=>[...a].sort(()=>Math.random()-.5);
const stage=$('stage'),river=$('river'),bear=$('bear'),bankR=$('bankR'),say=$('say');
let Q=[],ci=0,score=0,att=0,tries=0,busy=false,t0=0,mode='next';

let S=1;
function fit(){const r=stage.getBoundingClientRect();S=Math.max(.45,Math.min(1,(r.height-16)/400,(r.width*.56*.9)/176));stage.style.setProperty('--s',S)}
new ResizeObserver(fit).observe(stage);
function init(){fit();Q=sh(D);ci=0;score=0;att=0;t0=Date.now();$('modal').hidden=true;round()}

function homeBear(){bear.getAnimations().forEach(a=>a.cancel());bear.style.left='';bear.style.top='';stage.appendChild(bear);say.style.display=''}

function round(){
 busy=false;tries=0;const d=Q[ci];
 $('prog').textContent=(ci+1)+' / '+Q.length;$('score').textContent=score+'점';
 homeBear();
 $('sign').innerHTML=`<div class="sq"><ruby>一<rt>yī</rt></ruby><ruby>${d.q}<rt>${d.qp}</rt></ruby><span>＋ ?</span></div><div class="hint"><b>${d.hint}</b><small>양사와 짝꿍인 명사 배를 골라 곰을 태워 주세요</small></div>`;
 say.innerHTML=`<ruby>${d.q}<rt>${d.qp}</rt></ruby>`;
 $('fb').hidden=true;
 river.innerHTML='';
 sh([d,...sh(D.filter(x=>x!==d)).slice(0,2)]).forEach((o,i)=>river.appendChild(makeBoat(o,d,i)));
}

function makeBoat(o,d,i){
 const b=document.createElement('div');b.className='boat';b.tabIndex=0;b.setAttribute('role','button');
 b.setAttribute('aria-label',o.h+' '+o.p+' '+o.k);
 b.innerHTML=`<div class="sc"><div class="bob" style="animation-delay:${i*.5}s"><div class="deck"></div>
 <div class="cargo"><div class="em">${o.i}</div><ruby>${o.h}<rt>${o.p}</rt></ruby><div class="ko">${o.k}</div></div>
 <svg class="hull" viewBox="0 0 176 46"><path d="M4 4H172Q160 40 132 44H44Q16 40 4 4Z" fill="#9A5B21" stroke="#4A2A0C" stroke-width="3" stroke-linejoin="round"/><path d="M16 17H160M28 29H148" stroke="#D9963F" stroke-width="3" opacity=".7"/></svg></div></div>`;
 b.onclick=()=>pick(b,o,d);
 b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(b,o,d)}};
 return b}

// 곰이 현재 위치에서 목표 위치로 포물선을 그리며 폴짝 뛰어요
async function hop(to){
 const r=bear.getBoundingClientRect();
 const dx=to.left+to.width/2-(r.left+r.width/2),dy=to.bottom-r.bottom;
 const a=bear.animate([{transform:'translate(0,0)'},{transform:`translate(${dx/2}px,${dy/2-70}px) scale(1.12) rotate(-6deg)`},{transform:`translate(${dx}px,${dy}px)`}],{duration:700,easing:'ease-in-out',fill:'forwards'});
 await a.finished;
 bear.style.left=(bear.offsetLeft+dx)+'px';bear.style.top=(bear.offsetTop+dy)+'px';a.cancel()}
const deckRect=b=>b.querySelector('.deck').getBoundingClientRect();
function toDeck(b){bear.getAnimations().forEach(a=>a.cancel());b.querySelector('.deck').appendChild(bear);bear.style.left='-2px';bear.style.top='-2px'}
function toStage(){const r=bear.getBoundingClientRect(),s=stage.getBoundingClientRect();stage.appendChild(bear);bear.style.left=(r.left-s.left)+'px';bear.style.top=(r.top-s.top)+'px'}

async function pick(b,o,d){
 if(busy||b.classList.contains('gone'))return;
 busy=true;att++;tries++;say.style.display='none';
 await hop(deckRect(b));toDeck(b);
 const fm=`<div class="fm"><ruby>一<rt>yī</rt></ruby><ruby>${d.q}<rt>${d.qp}</rt></ruby><ruby>${o.h}<rt>${o.p}</rt></ruby></div>`;
 if(o===d){
  [...river.children].forEach(x=>{if(x!==b)x.style.opacity=.35});
  const dist=bankR.getBoundingClientRect().left+16-b.getBoundingClientRect().right;
  await b.animate([{transform:'translateX(0)'},{transform:`translateX(${dist}px)`}],{duration:1700,easing:'ease-in-out',fill:'forwards'}).finished;
  toStage();
  const r=bear.getBoundingClientRect(),br=bankR.getBoundingClientRect();
  await hop({left:br.left+br.width/2-30*S,width:60*S,bottom:r.bottom});
  score+=tries==1?10:tries==2?5:0;$('score').textContent=score+'점';
  fb(true,`<div class="ok">🎉 짝꿍 정답! 강을 건넜어요!</div>${fm}<small>${d.e}</small>`);
 }else{
  const sink=b.animate([{transform:'rotate(0) translateY(0)',opacity:1},{transform:'rotate(-12deg) translateY(14px)',opacity:1,offset:.35},{transform:'rotate(24deg) translateY(110px)',opacity:0}],{duration:1300,easing:'ease-in',fill:'forwards'});
  await sleep(380);toStage();
  const s=stage.getBoundingClientRect();
  await hop({left:s.left+s.width*.11-30*S,width:60*S,bottom:s.top+s.height/2+31*S});
  await sink.finished;b.classList.add('gone');homeBear();
  fb(false,`<div class="no">🌊 앗! 배가 가라앉았어요!</div><div><b>${o.h}</b> ${o.p}에는 양사 <b>${d.q}</b> ${d.qp}를 쓰지 않아요.</div><small>힌트: ${d.hint}</small>`);
 }}

function fb(ok,html){
 mode=ok?'next':'retry';$('ft').innerHTML=html+'<small>'+(ok?(ci==Q.length-1?'잠시 후 결과 화면으로 넘어가요…':'잠시 후 다음 강으로 넘어가요…'):'잠시 후 다시 도전해요…')+'</small>';
 $('fb').hidden=false;
 setTimeout(advance,ok?3000:2400)}

function advance(){
 $('fb').hidden=true;
 if(mode=='retry'){busy=false;return}
 ci++;ci>=Q.length?finish():round()}

function finish(){
 const s=Math.max(1,Math.round((Date.now()-t0)/1000));
 $('fs').textContent=score+'점 / '+Q.length*10+'점';
 $('ftm').textContent=(s>=60?Math.floor(s/60)+'분 ':'')+s%60+'초';
 $('fa').textContent=Math.round(Q.length/att*100)+'% (시도 '+att+'회)';
 $('list').innerHTML=D.map(x=>`<div><b>一${x.q}${x.h}</b> <span class="p">yī ${x.qp} ${x.p}</span> · ${x.k}</div>`).join('');
 $('modal').hidden=false}
$('again').onclick=init;
init();
</script>
</body>
</html>
